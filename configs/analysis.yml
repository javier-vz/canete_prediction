project:
  stage: "audit_only"
  crs: "EPSG:32718"
  thesis_version: "historical_reference"
  study_area: "UNRESOLVED_shared_mask"

spatial_support:
  historical_model1_cell_m: 250
  historical_model2_cell_m: 50
  primary_comparison_resolution_m: null  # Decide después de verificar máscaras y cobertura

labels:
  positive_definition: "review_original_site_points_by_date"
  unlabeled_definition: "no_documented_evidence"
  historical_buffer_m: 30  # Hallado en Grilla.ipynb, sujeto a sensibilidad; NO es decisión final
  exclude_post_field_observations_from_training: true
  exclude_all_site_distance_from_main_features: true

validation:
  strategy: "spatial_grouped_nested"
  block_size_m: null  # Estimar desde autocorrelación y geografía; evitar valor inventado
  keep_original_field_points_untouched: true
  metrics: ["capture_area", "partial_auc", "pr_auc_where_valid", "boyce_if_applicable"]

corridors:
  repo: "https://github.com/javier-vz/canete-corridor-model"
  commit: null  # Registrar al congelar integración
  layers: ["E", "T", "F", "L"]
  comparison: "same_spatial_support"

publication:
  publish_exact_site_coordinates: false
  publish_raw_field_photos: false
  publish_derivatives_only_after_permissions: true
